name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage binary
        shell: pwsh
        run: |
          Copy-Item "target/x86_64-pc-windows-msvc/release/telegram-pc-bot.exe" "telegram-pc-bot-windows-x86_64.exe"

      - name: Compute checksum
        shell: pwsh
        run: |
          (Get-FileHash "telegram-pc-bot-windows-x86_64.exe" -Algorithm SHA256).Hash.ToLower() + "  telegram-pc-bot-windows-x86_64.exe" | Out-File -Encoding ascii checksums.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-pc-bot-windows-x86_64.exe
          path: telegram-pc-bot-windows-x86_64.exe

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            telegram-pc-bot-windows-x86_64.exe
            checksums.txt